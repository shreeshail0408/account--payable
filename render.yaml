# Render blueprint for the PayFlow AP backend (Django API + PostgreSQL).
# Render dashboard → New → Blueprint → pick this repository. You'll be asked for the values
# marked `sync: false` (the first administrator's login). The frontend is on GitHub Pages
# (.github/workflows/pages.yml) and calls this API.
databases:
  - name: payflow-ap-db
    plan: free
    region: singapore
    databaseName: ap_automation
    user: payflow

services:
  - type: web
    name: payflow-ap-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_SECURE_PROXY_SSL_HEADER
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: https://shreeshail0408.github.io
      # Serve uploaded invoice files from the app itself. Render's free disk is ephemeral:
      # uploads are lost when the service restarts or redeploys.
      - key: AP_SERVE_MEDIA
        value: "true"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: POSTGRES_HOST
        fromDatabase:
          name: payflow-ap-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: payflow-ap-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: payflow-ap-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: payflow-ap-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: payflow-ap-db
          property: password
      # First administrator, created on the first deploy only (start.sh → create_ap_admin --if-missing).
      - key: AP_ADMIN_USERNAME
        sync: false
      - key: AP_ADMIN_EMAIL
        sync: false
      - key: AP_ADMIN_PASSWORD
        sync: false
