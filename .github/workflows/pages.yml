# Builds the React frontend and publishes it to GitHub Pages at
# https://shreeshail0408.github.io/account--payable/
# One-time setup: Settings → Pages → Source: "GitHub Actions".
# The API URL comes from the repository variable VITE_API_URL (Settings → Secrets and variables →
# Actions → Variables), defaulting to the Render service in render.yaml.
name: Deploy frontend to GitHub Pages

# Runs on every push to main (not only frontend changes): if Pages is still set to "Deploy from a
# branch", GitHub's own README build runs on each push too, and this later deploy puts the app back.
# Settings → Pages → Source: "GitHub Actions" removes that README build entirely.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://payflow-ap-api.onrender.com/api' }}
      # Client-side routes (e.g. /invoices) have no file on Pages; serve the app for them too.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # While Pages is set to "Deploy from a branch", GitHub also publishes the README for this commit.
      # Wait for that run to finish so the app is always the last thing deployed.
      - name: Wait for GitHub's branch-mode Pages build (if any)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 40); do
            pending=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=50" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment" and .status != "completed")] | length')
            if [ "$pending" = "0" ]; then
              echo "No branch-mode Pages build pending."
              break
            fi
            echo "Waiting for branch-mode Pages build ($attempt)..."
            sleep 10
          done
          # Its deploy step reports completion slightly before the site switches over.
          sleep 15
      - id: deployment
        uses: actions/deploy-pages@v4
